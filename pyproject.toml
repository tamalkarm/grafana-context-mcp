[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grafana-context-mcp"
version = "0.1.0"
description = "Read-only MCP server for exploring Grafana data sources and dashboards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp==4.0.0",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
grafana-mcp = "grafana_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
